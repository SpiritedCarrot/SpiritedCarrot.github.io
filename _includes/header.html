<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <span class="site-mark" aria-hidden="true"></span>
      <span>{{ site.title | escape }}</span>
    </a>

    {% if site.header_pages %}
      <nav class="site-nav" aria-label="Main navigation">
        <div class="trigger">
          {% for path in site.header_pages %}
            {% assign nav_page = site.pages | where: "path", path | first %}

            {% if nav_page and nav_page.title %}
              <a class="page-link" href="{{ nav_page.url | relative_url }}">
                {{ nav_page.title | escape }}
              </a>
            {% endif %}
          {% endfor %}
        </div>
      </nav>
    {% endif %}
  </div>
</header>
