<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title | escape }}</title>

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ '/assets/images/favicon-32.png' | relative_url }}?v=2"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="{{ '/assets/images/favicon-16.png' | relative_url }}?v=2"
    >

    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
